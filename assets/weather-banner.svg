<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Animated WeatherNova weather scene">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#082f49"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff7ad"/><stop offset=".35" stop-color="#fbbf24" stop-opacity=".95"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="glass"><stop stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#sky)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<g opacity=".7" fill="#e0f2fe">
 <circle cx="100" cy="70" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="270" cy="105" r="1.4"><animate attributeName="opacity" values="1;.1;1" dur="3.6s" repeatCount="indefinite"/></circle>
 <circle cx="930" cy="68" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="1060" cy="120" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="4s" repeatCount="indefinite"/></circle>
</g>
<g filter="url(#glow)"><circle cx="1030" cy="78" r="62" fill="url(#sun)"/><circle cx="1030" cy="78" r="25" fill="#fde68a"><animate attributeName="r" values="25;29;25" dur="3s" repeatCount="indefinite"/></circle></g>
<g fill="#dbeafe" opacity=".9">
 <g><path d="M-170 145 Q-100 105 -30 145 Q20 112 72 150 Q125 153 145 188 H-190Z"/><animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="24s" repeatCount="indefinite"/></g>
 <g opacity=".72"><path d="M-250 225 Q-175 178 -100 220 Q-45 185 15 225 Q65 230 88 260 H-270Z"/><animateTransform attributeName="transform" type="translate" from="0 0" to="150 0" dur="19s" repeatCount="indefinite"/></g>
</g>
<g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity=".65">
 <path d="M170 195l-12 28"><animateTransform attributeName="transform" type="translate" values="0 -20;0 55" dur="1.1s" repeatCount="indefinite"/></path>
 <path d="M205 195l-12 28"><animateTransform attributeName="transform" type="translate" values="0 -20;0 55" dur="1.35s" repeatCount="indefinite"/></path>
 <path d="M240 195l-12 28"><animateTransform attributeName="transform" type="translate" values="0 -20;0 55" dur=".95s" repeatCount="indefinite"/></path>
 <path d="M275 195l-12 28"><animateTransform attributeName="transform" type="translate" values="0 -20;0 55" dur="1.25s" repeatCount="indefinite"/></path>
</g>
<rect x="250" y="78" width="700" height="190" rx="24" fill="url(#glass)" stroke="#7dd3fc" stroke-opacity=".28"/>
<text x="600" y="145" text-anchor="middle" fill="#e0f2fe" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800" letter-spacing="7">WEATHERNOVA</text>
<text x="600" y="180" text-anchor="middle" fill="#7dd3fc" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="4">LIVE WEATHER • REAL-TIME INSIGHTS</text>
<g fill="#38bdf8"><circle cx="475" cy="220" r="4"><animate attributeName="r" values="3;7;3" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="600" cy="220" r="4"><animate attributeName="r" values="3;7;3" dur="1.4s" begin=".45s" repeatCount="indefinite"/></circle><circle cx="725" cy="220" r="4"><animate attributeName="r" values="3;7;3" dur="1.4s" begin=".9s" repeatCount="indefinite"/></circle></g>
<path d="M0 318 C170 285 300 340 470 310 S790 285 1200 320" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2"><animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 318 C170 285 300 340 470 310 S790 285 1200 320;M0 320 C170 345 300 285 470 320 S790 340 1200 315;M0 318 C170 285 300 340 470 310 S790 285 1200 320"/></path>
</svg>